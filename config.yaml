# Cluster configuration. The code never hard-codes node addresses:
# change only this file to move from the mock cluster to Kaggle or RunPod.

router:
  host: 0.0.0.0
  port: 8000
  strategy: round_robin          # name of a file in strategies/ (without .py)
  results_dir: results           # one CSV file per run is written here
  run_id: dev                    # change for every experiment run

energy:
  # How a node's measured energy is shared among requests served at the same time
  # (infra/attribute_energy.py): tokens | equal. Final choice: task #26.
  method: tokens

model:
  # The same model file is served on every node, so only the GPU changes between runs.
  name: Qwen3-8B
  hf_repo: Qwen/Qwen3-8B             # original weights (for vLLM)
  gguf_quant: Q4_K_M                 # 4-bit GGUF for llama.cpp, about 5 GB
  max_context: 8192                  # enough for the workloads; keeps KV cache small on 16 GB cards
  thinking: false                    # Qwen3 thinking mode off, so output lengths stay comparable

nodes:
  # kind: mock | llamacpp | vllm
  # speed_tps / prefill_tps: decode / prompt tokens per second of the node, measured once per GPU type;
  #   passed to the strategies (and used by the mock server)
  # gpu_index (and host, if nodes are on several machines): which GPU's power log belongs to the node
  - name: fast
    url: http://127.0.0.1:9001
    kind: mock
    speed_tps: 60
  - name: medium
    url: http://127.0.0.1:9002
    kind: mock
    speed_tps: 30
  - name: slow
    url: http://127.0.0.1:9003
    kind: mock
    speed_tps: 10
