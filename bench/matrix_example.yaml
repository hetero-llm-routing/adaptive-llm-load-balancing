# Experiment matrix of the Phase 4 plan (315 real runs, 9 strategies). Run after bench/calibrate.py.
config: config_run.yaml                 # written by infra/cluster_up.py
calibration: results/calibration/calibration.json  # round-robin saturation rate per workload
workloads_dir: bench/workloads
results_dir: results/runs
duration_s: 300                         # arrivals per run; requests of the first warmup_s are not analysed
warmup_s: 30
cooldown_s: 30                          # idle time between runs
timeout_s: 600
seeds: [1, 2, 3, 4, 5]
strategies: [round_robin, weighted, least_load, least_work, power_of_two, predictive, marginal_cost, oracle, rl]
experiments:
  - name: main                          # RQ1, RQ2: 9 strategies x 3 loads x 5 seeds = 135
    workloads: [mixed]
    rho: [0.3, 0.6, 0.9]
  - name: bytype                        # energy and latency per request type: 9 x 3 x 5 = 135
    workloads: [chat, doc, rag]
    rho: [0.6]
  - name: bursts                        # Azure-trace bursts: 9 x 5 = 45
    workloads: [mixed]
    rho: [0.6]
    arrival: azure
