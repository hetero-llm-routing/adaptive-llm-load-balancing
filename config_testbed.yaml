# Testbed configuration (RunPod). Same format as config.yaml; copy it and set the node URLs
# of the pods of the session. Speeds measured on Oct 27 with scripts/runpod_check.py
# (results/runpod_check/); measure again at the start of each session and update them.
#
# Node URL on RunPod: https://<pod-id>-8080.proxy.runpod.net (expose HTTP port 8080).
# Wait about 30 s after the servers start before a run (the GPUs stay in a high-power
# state for a few seconds after loading the model).

router:
  host: 0.0.0.0
  port: 8000
  strategy: round_robin
  results_dir: results
  run_id: testbed
  state_interval_s: 0.25         # nodes are on other machines: read their state in the background

energy:
  method: tokens

model:
  name: Qwen3-8B
  hf_repo: Qwen/Qwen3-8B
  gguf_quant: Q4_K_M
  max_context: 8192
  thinking: false

nodes:
  - name: rtx4090
    url: https://POD-ID-8080.proxy.runpod.net
    kind: llamacpp
    speed_tps: 149.3
    prefill_tps: 11468
    gpu_index: 0
  - name: rtxa6000
    url: https://POD-ID-8080.proxy.runpod.net
    kind: llamacpp
    speed_tps: 98.1
    prefill_tps: 4679
    gpu_index: 0
  - name: rtx2000ada
    url: https://POD-ID-8080.proxy.runpod.net
    kind: llamacpp
    speed_tps: 40.4
    prefill_tps: 2016
    gpu_index: 0
